<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2026학년도 2학기 1차고사</title>
    <link rel="stylesheet" href="style.css?v=20261009a">
  </head>
  <body>
    <main class="app-shell">
      <section id="start-screen" class="screen start-screen" aria-labelledby="app-title">
        <div id="start-content" class="start-content">
          <header class="start-header">
            <h1 id="app-title">2026학년도 2학기 1차고사</h1>
            <button id="start-fullscreen-button" class="text-button" type="button" data-fullscreen-button>전체 화면</button>
          </header>

          <div class="field">
            <div class="date-grid" id="date-options" role="group" aria-label="날짜"></div>
          </div>

          <div class="field grade-field">
            <div class="grade-grid" id="grade-options" role="group" aria-label="학년"></div>
          </div>

          <div class="field test-time-row">
            <button id="test-toggle" class="test-toggle" type="button" aria-expanded="false" aria-controls="test-time">
              <span>테스트 시간</span>
              <!-- 접힌 상태: 오른쪽(>) / 펼친 상태: 아래쪽(∨) -->
              <svg class="chevron chevron-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
              <svg class="chevron chevron-right" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
            </button>
            <input id="test-time" type="text" inputmode="numeric" autocomplete="off" aria-label="테스트 시간" hidden>
          </div>

          <p id="start-error" class="start-error" role="alert"></p>
          <button id="start-button" class="primary-button" type="button">시작</button>
        </div>
      </section>

      <section id="exam-screen" class="screen exam-screen hidden">
        <!-- 위쪽 2×2: 왼쪽 열(이전 화면 / 현재 시각), 오른쪽 열(전체 화면 / 날짜·학년) -->
        <header id="top-bar" class="top-bar">
          <button id="back-button" class="text-button top-button" type="button">이전 화면</button>
          <button id="exam-fullscreen-button" class="text-button top-button top-end" type="button" data-fullscreen-button>전체 화면</button>
          <div class="top-clock top-text" id="current-time">현재 시각   --시 --분</div>
          <div class="top-selection top-text top-end">
            <span id="test-badge" class="test-badge hidden"></span>
            <span id="selection-label"></span>
          </div>
        </header>

        <div class="main-area">
          <div id="stage" class="stage">
            <div id="stage-content" class="stage-content">
              <p id="status-message" class="status-message">--</p>
              <p id="time-notice" class="time-notice">실제 시종과 차이가 날 수 있습니다</p>
              <p id="remaining-time" class="remaining-time">--:--</p>
            </div>
          </div>

          <aside id="schedule-panel" class="schedule-panel" aria-labelledby="schedule-title">
            <h2 id="schedule-title">오늘의 시간표</h2>
            <ol id="schedule-list" class="schedule-list"></ol>
          </aside>
        </div>
      </section>
    </main>

    <script src="script.js?v=20261009a"></script>
  </body>
</html>
